<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Antivirus</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <div class="logo"></div>
                <h1>AEGIS</h1>
            </div>
            <nav>
                <a href="#" class="active"><span class="icon">⊞</span> Dashboard</a>
                <a href="#"><span class="icon">⚡</span> Quarantine</a>
                <a href="#"><span class="icon">⚙</span> Settings</a>
            </nav>
            <div class="status-indicator safe">
                <span class="dot"></span>
                SYSTEM SECURE
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h2>Real-Time Telemetry</h2>
                <div class="lone-wolf-badge">Lone Wolf Local Engine</div>
            </header>

            <div class="stats-grid">
                <div class="stat-card glass-panel">
                    <h3>Threats Blocked</h3>
                    <div class="value neon-text" id="threat-count">0</div>
                </div>
                <div class="stat-card glass-panel">
                    <h3>Memory Scanned</h3>
                    <div class="value">14.2 GB</div>
                </div>
                <div class="stat-card glass-panel">
                    <h3>Engine Status</h3>
                    <div class="value safe-text">ACTIVE</div>
                </div>
            </div>

            <section class="threat-matrix glass-panel">
                <h3>Threat Matrix Log</h3>
                <div class="log-container" id="log-container">
                    <!-- Logs injected via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
